<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpStreak</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ════════ DESIGN TOKENS ════════ */
:root{
  /* Brand — warm slate-orange */
  --a:#E07A3A;--a2:#C45E20;--a3:rgba(224,122,58,.09);--a4:rgba(224,122,58,.2);
  /* Surfaces */
  --bg:#F7F6F3;--s0:#FFFFFF;--s1:#F2F0EC;--s2:#E8E5DE;--s3:#D4D0C8;
  /* Ink */
  --t:#1E1A16;--t2:rgba(30,26,22,.52);--t3:rgba(30,26,22,.34);--t4:rgba(30,26,22,.1);
  /* Status */
  --G:#1A6B3A;--Gb:rgba(26,107,58,.09);--Gd:rgba(26,107,58,.22);
  --Am:#96550D;--Ab:rgba(150,85,13,.09);--Ad:rgba(150,85,13,.22);
  --R:#B82020;--Rb:rgba(184,32,32,.09);--Rd:rgba(184,32,32,.22);
  --Bl:#2558C4;--Bb:rgba(37,88,196,.09);--Bd:rgba(37,88,196,.22);
  --Pu:#6B41CC;--Pub:rgba(107,65,204,.09);--Pud:rgba(107,65,204,.22);
  /* Type */
  --serif:'Instrument Serif',serif;
  --sans:'DM Sans',sans-serif;
  --mono:'JetBrains Mono',monospace;
  /* Elevation */
  --sh1:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh2:0 4px 14px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.04);
  --sh3:0 12px 36px rgba(0,0,0,.13),0 4px 12px rgba(0,0,0,.06);
  /* Radius */
  --r4:4px;--r8:8px;--r12:12px;--rfull:999px;
}
/* Dark */
body.dark{--bg:#110F0B;--s0:#1C1915;--s1:#232019;--s2:#2C2820;--s3:#37322A;--t:#F2EEE8;--t2:rgba(242,238,232,.52);--t3:rgba(242,238,232,.32);--t4:rgba(242,238,232,.1);}
/* Themes */
body.ocean{--a:#0B84C8;--a2:#0668A0;--a3:rgba(11,132,200,.09);--a4:rgba(11,132,200,.2);}
body.forest{--a:#1E7D46;--a2:#166035;--a3:rgba(30,125,70,.09);--a4:rgba(30,125,70,.2);}
body.violet{--a:#7040D0;--a2:#5830AA;--a3:rgba(112,64,208,.09);--a4:rgba(112,64,208,.2);}
body.rose{--a:#C42444;--a2:#A01836;--a3:rgba(196,36,68,.09);--a4:rgba(196,36,68,.2);}
body.amber{--a:#C47808;--a2:#9E6006;--a3:rgba(196,120,8,.09);--a4:rgba(196,120,8,.2);}
body.teal{--a:#0E9890;--a2:#0C7A73;--a3:rgba(14,152,144,.09);--a4:rgba(14,152,144,.2);}
body.slate{--a:#4C6280;--a2:#384B62;--a3:rgba(76,98,128,.09);--a4:rgba(76,98,128,.2);}

/* ════════ RESET ════════ */
*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:13.5px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
body{font-family:var(--sans);background:var(--bg);color:var(--t);overflow:hidden;height:100vh;letter-spacing:-.005em;}
input,select,textarea,button{font-family:var(--sans);}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:var(--s3);border-radius:3px;}
::-webkit-scrollbar-track{background:transparent;}

/* ════════ APP SHELL ════════ */
#app{display:flex;flex-direction:column;height:100vh;}
#app.hidden{visibility:hidden;}
#app.visible{visibility:visible;}

/* ════════ NAV ════════ */
.nav{height:54px;background:var(--s0);border-bottom:1px solid var(--t4);display:flex;align-items:center;padding:0 20px;gap:0;flex-shrink:0;z-index:100;position:relative;box-shadow:var(--sh1);}
.brand{display:flex;align-items:center;gap:9px;padding-right:15px;border-right:1px solid var(--t4);margin-right:10px;flex-shrink:0;}
.brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(140deg,var(--a),var(--a2));display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px var(--a3);}
.brand-mark svg{width:15px;height:15px;}
.brand-name{font-size:15.5px;font-weight:700;color:var(--t);letter-spacing:-.025em;}
.brand-name .op{color:var(--a);}
.org-pill{font-size:10px;padding:2px 8px;border-radius:var(--rfull);background:var(--a3);color:var(--a);border:1px solid var(--a4);font-weight:600;margin-left:3px;letter-spacing:.01em;}
.nav-tabs{display:flex;flex:1;overflow-x:auto;}
.nav-tabs::-webkit-scrollbar{display:none;}
.ntab{height:54px;padding:0 13px;border:none;background:transparent;font-size:12px;font-weight:500;color:var(--t2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:5px;transition:color .15s;letter-spacing:-.005em;}
.ntab:hover{color:var(--t);}
.ntab.on{color:var(--a);border-bottom-color:var(--a);font-weight:600;}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:7px;padding-left:12px;flex-shrink:0;}
.icon-btn{width:33px;height:33px;border-radius:var(--r8);border:1px solid var(--t4);background:var(--s0);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--t2);transition:all .15s;}
.icon-btn:hover{border-color:var(--a);background:var(--a3);color:var(--a);}
.user-chip{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 4px;border-radius:var(--rfull);border:1px solid var(--t4);cursor:pointer;background:var(--s0);transition:border-color .15s;}
.user-chip:hover{border-color:var(--a);}
.user-av{width:24px;height:24px;border-radius:50%;background:linear-gradient(140deg,var(--a),var(--a2));color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.user-nm{font-size:12px;font-weight:500;color:var(--t);}

/* ════════ BODY LAYOUT ════════ */
.body{display:flex;flex:1;overflow:hidden;}
.sb{width:210px;flex-shrink:0;border-right:1px solid var(--t4);background:var(--s0);display:flex;flex-direction:column;overflow:hidden;}
.sb-scroll{flex:1;overflow-y:auto;padding:6px 0;}
.main{flex:1;overflow-y:auto;background:var(--bg);}
.pad{padding:22px 24px;max-width:1320px;}

/* ════════ SIDEBAR ════════ */
.sb-lbl{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);padding:10px 14px 3px;}
.sb-sep{height:1px;background:var(--t4);margin:5px 8px;}
.sb-btn{display:flex;align-items:center;gap:8px;width:100%;padding:7px 14px;border:none;background:transparent;cursor:pointer;text-align:left;position:relative;transition:background .12s;}
.sb-btn:hover{background:var(--s1);}
.sb-btn.on{background:var(--a3);}
.sb-btn.on::after{content:'';position:absolute;right:0;top:5px;bottom:5px;width:3px;border-radius:2px 0 0 2px;background:var(--a);}
.sb-ico{font-size:14px;width:18px;text-align:center;flex-shrink:0;}
.sb-nm{font-size:12px;font-weight:500;color:var(--t2);flex:1;text-align:left;letter-spacing:-.005em;}
.sb-btn.on .sb-nm{color:var(--a);font-weight:600;}
.sb-tag{font-size:10px;padding:1px 6px;border-radius:var(--rfull);background:var(--s2);color:var(--t3);font-family:var(--mono);}
.sb-btn.on .sb-tag{background:var(--a3);color:var(--a);}
.sb-foot{padding:8px;border-top:1px solid var(--t4);flex-shrink:0;}
.logout-btn{display:flex;align-items:center;gap:7px;width:100%;padding:8px 12px;border:1px solid var(--t4);border-radius:var(--r8);background:transparent;cursor:pointer;font-size:12px;color:var(--t2);transition:all .15s;}
.logout-btn:hover{border-color:var(--R);color:var(--R);background:var(--Rb);}

/* ════════ BUTTONS ════════ */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 15px;border-radius:var(--rfull);font-size:12px;font-weight:500;cursor:pointer;border:none;white-space:nowrap;transition:all .18s;letter-spacing:-.005em;}
.btn-p{background:linear-gradient(140deg,var(--a),var(--a2));color:#fff;box-shadow:0 2px 8px var(--a3);}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 4px 14px var(--a4);}
.btn-g{background:var(--s0);color:var(--t);border:1px solid var(--t4);}
.btn-g:hover{border-color:var(--a);color:var(--a);background:var(--a3);}
.btn-sm{padding:5px 12px;font-size:11px;}
.btn-xs{padding:3px 9px;font-size:10px;}

/* ════════ PAGE HEADERS ════════ */
.pg-title{font-family:var(--serif);font-size:22px;font-style:italic;color:var(--t);margin-bottom:3px;line-height:1.2;letter-spacing:.01em;}
.pg-sub{font-size:12px;color:var(--t2);line-height:1.6;margin-bottom:16px;}
.pg-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;}

/* ════════ CARDS ════════ */
.card{background:var(--s0);border:1px solid var(--t4);border-radius:var(--r12);padding:15px 17px;box-shadow:var(--sh1);}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}
.card-ttl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--t3);}

/* ════════ METRIC CARDS ════════ */
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px;}
.mc{background:var(--s0);border:1px solid var(--t4);border-radius:var(--r12);padding:13px 15px;box-shadow:var(--sh1);transition:transform .2s;}
.mc:hover{transform:translateY(-1px);box-shadow:var(--sh2);}
.mc.hi{background:linear-gradient(140deg,var(--a),var(--a2));border-color:var(--a);box-shadow:0 4px 16px var(--a3);}
.mc.hi .mv,.mc.hi .ml{color:#fff;}
.mc.hi .ml{opacity:.76;}
.mv{font-size:22px;font-weight:700;color:var(--t);line-height:1;font-family:var(--mono);}
.ml{font-size:11px;color:var(--t2);margin-top:4px;font-weight:500;}

/* ════════ STATUS PILLS ════════ */
.sp{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:var(--rfull);}
.sp-on{background:var(--Gb);color:var(--G);border:1px solid var(--Gd);}
.sp-needs{background:var(--Ab);color:var(--Am);border:1px solid var(--Ad);}
.sp-off{background:var(--Rb);color:var(--R);border:1px solid var(--Rd);}
.sp-none{background:var(--s1);color:var(--t3);border:1px solid var(--t4);}

/* ════════ ROLE HERO ════════ */
.role-hero{background:linear-gradient(140deg,rgba(224,122,58,.06),rgba(224,122,58,.02));border:1.5px solid var(--a4);border-radius:var(--r12);padding:16px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px;}
.ring-wrap{position:relative;width:54px;height:54px;flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--t);font-family:var(--mono);}
.hero-name{font-size:15px;font-weight:600;color:var(--t);letter-spacing:-.01em;}
.hero-dept{font-size:11px;color:var(--a);font-weight:600;margin-top:2px;}
.hero-desc{font-size:12px;color:var(--t2);margin-top:5px;line-height:1.55;}
.hero-chips{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;}
.hchip{font-size:11px;padding:2px 8px;border-radius:var(--rfull);background:var(--s0);border:1px solid var(--t4);color:var(--t2);}
.hchip b{color:var(--t);font-weight:600;}

/* ════════ ACTIVITY ITEMS ════════ */
.freq-blk{margin-bottom:16px;}
.freq-hd{display:flex;align-items:center;gap:7px;margin-bottom:7px;padding-bottom:5px;border-bottom:1px solid var(--t4);}
.fpill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:var(--rfull);letter-spacing:.03em;}
.fp-d{background:var(--Gb);color:var(--G);border:1px solid var(--Gd);}
.fp-w{background:var(--Bb);color:var(--Bl);border:1px solid var(--Bd);}
.fp-m{background:var(--Pub);color:var(--Pu);border:1px solid var(--Pud);}
.freq-lbl{font-size:12px;font-weight:600;color:var(--t);}
.freq-cnt{margin-left:auto;font-size:10px;color:var(--t3);font-family:var(--mono);}
.act{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1.5px solid var(--t4);border-radius:var(--r8);margin-bottom:5px;cursor:pointer;transition:all .2s;user-select:none;background:var(--s0);}
.act:hover:not(.done){background:var(--s1);border-color:var(--t3);transform:translateX(2px);}
.act.done{border-color:var(--a);background:linear-gradient(135deg,rgba(255,250,245,.8),rgba(255,242,228,.8));}
.act-cb{width:21px;height:21px;border-radius:5px;border:1.5px solid var(--t3);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--s0);transition:all .22s;}
.act.done .act-cb{background:var(--a);border-color:var(--a);box-shadow:0 2px 8px var(--a3);}
.chk{display:none;width:11px;height:11px;}
.act.done .chk{display:block;}
.act-nm{font-size:12.5px;font-weight:500;color:var(--t);flex:1;letter-spacing:-.005em;}
.act.done .act-nm{color:var(--t2);text-decoration:line-through;text-decoration-color:var(--a4);}
.act-hint{font-size:10px;color:var(--t3);margin-top:1px;}
.nin{width:60px;padding:3px 6px;border-radius:var(--r4);border:1px solid var(--t4);background:var(--s1);color:var(--t);font-size:11px;font-family:var(--mono);text-align:right;outline:none;transition:border-color .15s;}
.nin:focus{border-color:var(--a);background:var(--s0);}
.nunit{font-size:10px;color:var(--t3);white-space:nowrap;font-weight:500;}
.all-done-bar{background:linear-gradient(135deg,var(--a3),rgba(224,122,58,.03));border:1.5px solid var(--a4);border-radius:var(--r8);padding:10px 14px;margin-bottom:13px;display:flex;align-items:center;gap:10px;}
.adb-ico{width:24px;height:24px;border-radius:6px;background:linear-gradient(140deg,var(--a),var(--a2));display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ════════ HEATMAPS ════════ */
.hmap{background:var(--s0);border:1px solid var(--t4);border-radius:var(--r12);padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh1);}
.hmap-ttl{font-size:12px;font-weight:600;color:var(--t);margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;}
.hmap-sub{font-size:10px;color:var(--t3);font-weight:400;}
.hleg{display:flex;align-items:center;gap:3px;margin-top:7px;font-size:10px;color:var(--t3);}
.hleg-c{width:9px;height:9px;border-radius:2px;}

/* ════════ PROJECTS ════════ */
.proj-card{background:var(--s0);border:1px solid var(--t4);border-radius:var(--r12);padding:15px 17px;margin-bottom:10px;box-shadow:var(--sh1);transition:all .18s;cursor:pointer;}
.proj-card:hover{border-color:var(--a);box-shadow:var(--sh2);transform:translateY(-1px);}
.proj-name{font-size:14px;font-weight:600;color:var(--t);letter-spacing:-.01em;}
.proj-meta{font-size:11px;color:var(--t2);margin-top:2px;}
.proj-bar{height:5px;background:var(--s2);border-radius:3px;margin-top:10px;overflow:hidden;}
.proj-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--a),var(--a2));transition:width .5s;}
.ms-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--t4);}
.ms-cb{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--t3);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s;background:var(--s0);}
.ms-cb.dn{background:var(--G);border-color:var(--G);}
.ms-nm{font-size:12px;color:var(--t);flex:1;}
.ms-cb.dn~.ms-nm{text-decoration:line-through;color:var(--t3);}
.ms-dt{font-size:10px;color:var(--t3);font-family:var(--mono);white-space:nowrap;}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.kb-col{background:var(--s1);border-radius:var(--r12);padding:11px;}
.kb-col-hd{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t2);margin-bottom:9px;display:flex;align-items:center;gap:6px;}
.kb-cnt{font-size:10px;padding:1px 6px;border-radius:var(--rfull);background:var(--s2);color:var(--t3);font-family:var(--mono);}
.kb-card{background:var(--s0);border:1px solid var(--t4);border-radius:var(--r8);padding:10px 11px;margin-bottom:6px;box-shadow:var(--sh1);transition:all .18s;}
.kb-card:hover{border-color:var(--a);box-shadow:var(--sh2);}
.kb-card-nm{font-size:12px;font-weight:500;color:var(--t);}
.kb-card-meta{font-size:10px;color:var(--t3);margin-top:4px;display:flex;gap:7px;flex-wrap:wrap;}

/* ════════ GOALS ════════ */
.goal-card{background:var(--s0);border:1px solid var(--t4);border-radius:var(--r12);padding:15px 17px;margin-bottom:10px;box-shadow:var(--sh1);}
.goal-ttl{font-size:13px;font-weight:600;color:var(--t);letter-spacing:-.01em;}
.goal-meta{font-size:11px;color:var(--t2);margin-top:2px;}
.goal-prog{display:flex;align-items:center;gap:10px;margin-top:10px;}
.goal-bar{flex:1;height:5px;background:var(--s2);border-radius:3px;overflow:hidden;}
.goal-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--a),var(--a2));transition:width .5s;}
.goal-pct{font-size:11px;font-family:var(--mono);color:var(--a);font-weight:700;}
.kpi-row{display:flex;align-items:center;gap:11px;padding:9px 12px;border:1px solid var(--t4);border-radius:var(--r8);margin-bottom:5px;background:var(--s0);}
.kpi-nm{font-size:12px;font-weight:500;color:var(--t);flex:1;}
.kpi-val{font-size:13px;font-weight:700;color:var(--t);font-family:var(--mono);}
.kpi-tgt{font-size:10px;color:var(--t3);}
.kpi-up{font-size:11px;font-weight:600;color:var(--G);}
.kpi-dn{font-size:11px;font-weight:600;color:var(--R);}
.disc-entry{padding:11px 0;border-bottom:1px solid var(--t4);}
.disc-hd{display:flex;align-items:center;gap:7px;margin-bottom:4px;}
.disc-auth{font-size:11px;font-weight:600;color:var(--t);}
.disc-dt{font-size:10px;color:var(--t3);font-family:var(--mono);}
.disc-txt{font-size:12px;color:var(--t2);line-height:1.6;}

/* ════════ HRMS ════════ */
.emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:16px;}
.emp-card{background:var(--s0);border:1px solid var(--t4);border-radius:var(--r12);padding:14px 15px;box-shadow:var(--sh1);transition:all .18s;}
.emp-card:hover{border-color:var(--a);transform:translateY(-1px);box-shadow:var(--sh2);}
.emp-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(140deg,var(--a),var(--a2));color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:9px;}
.emp-name{font-size:13px;font-weight:600;color:var(--t);letter-spacing:-.01em;}
.emp-role{font-size:11px;color:var(--t2);margin-top:1px;}
.emp-dept{font-size:10px;color:var(--a);font-weight:600;margin-top:3px;}
.emp-chips{display:flex;gap:3px;margin-top:7px;flex-wrap:wrap;}
.emp-chip{font-size:10px;padding:2px 6px;border-radius:var(--rfull);background:var(--s1);color:var(--t3);font-weight:500;}

/* ════════ INTEGRATIONS ════════ */
.int-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:10px;margin-bottom:16px;}
.int-card{background:var(--s0);border:1.5px solid var(--t4);border-radius:var(--r12);padding:14px 15px;transition:all .18s;}
.int-card:hover:not(.connected){border-color:var(--a);transform:translateY(-1px);box-shadow:var(--sh2);}
.int-card.connected{border-color:var(--G);}

      +'<div style="display:flex;align-items:center;gap:10px">'
      +'<div style="font-size:14px">'+(DB[grp.dept]?.icon||'💼')+'</div>'
      +'<div><div style="font-size:13px;font-weight:600;color:var(--t)">'+grp.role+'</div>'
      +'<div style="font-size:11px;color:var(--t2);margin-top:1px">'+grp.dept+' · '+grp.members.length+(grp.members.length===1?' person':' people')+'</div></div>'

      +'<div style="display:flex;gap:6px">'
      +grp.members.map(m=>'<div style="display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;background:var(--s0);border:1px solid var(--t4);font-size:11px"><div class="av" style="width:20px;height:20px;font-size:9px">'+m.name.split(' ').map(w=>w[0]).join('').slice(0,2)+'</div><span style="font-weight:500;color:var(--t)">'+m.name.split(' ')[0]+'</span><span style="color:var(--a);font-family:var(--mono);font-weight:700">'+m.streak+'🔥</span></div>').join('')
      +'</div>'

      h+='<div style="border-bottom:1px solid var(--t4)">';
      // Freq label row
      h+='<div style="padding:6px 16px;display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.015)">'
        +'<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:'+fpBg+';color:'+fpColor+';border:1px solid '+fpColor+'33;letter-spacing:.03em;text-transform:uppercase">'+freq+'</span>'
        +'<span style="font-size:11px;font-weight:600;color:var(--t)">'+freqActs.length+' activities</span>'
        +'</div>';

      // Table: activities as rows, members as columns + value column
      h+='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">';

        h+='<th style="padding:7px 11px;text-align:center;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);border-bottom:1px solid var(--t4);white-space:nowrap;min-width:90px">'+m.name.split(' ')[0]+'</th>';
      });
      if(grp.members.length>1)h+='<th style="padding:7px 11px;text-align:center;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--a);border-bottom:1px solid var(--t4);white-space:nowrap;background:var(--a3)">Team total</th>';
      h+='</tr></thead><tbody>';

          +'</td>';

        h+='<td style="padding:9px 11px;border-bottom:1px solid var(--t4);font-size:10px;color:var(--t3);font-weight:500;white-space:nowrap">'+(act.u||'—')+'</td>';
        // Per member: look up actual log value or use synthetic from TEAM.d
        let teamTotal=0;

          const checkIcon=isDone&&val===null?'<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 7L5.5 10L11.5 4" stroke="var(--G)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>':'';
          const emptyIcon=!isDone?'<div style="width:20px;height:20px;border-radius:4px;border:1.5px solid var(--s3);display:inline-flex;align-items:center;justify-content:center"><svg width="8" height="8" viewBox="0 0 8 8"><rect x="2" y="3.5" width="4" height="1" rx=".5" fill="var(--s3)"/></svg></div>':'';

          h+='<td style="padding:8px 11px;border-bottom:1px solid var(--t4);text-align:center;background:var(--a3)">'+totalStr+'</td>';
        }
        h+='</tr>';
      });

      h+='</tbody></table></div></div>';
    });

    h+='</div>'; // close role card
  }

  // If no department filter — also show cross-dept summary heatmap
  if(cLDept==='All'&&filt.length){
    h+='<div class="hmap" style="margin-top:4px"><div class="hmap-ttl">7-day input count heatmap — all members <span class="hmap-sub">Numbers show total inputs per day</span></div>';

      });
    });
    h+='</div><div class="hleg" style="margin-top:7px">Numbers = total inputs logged · Highlighted column = today</div></div>';
  }

  c.innerHTML=h;
}

function burst(el){const ptl=document.getElementById('ptl');const rb=el.getBoundingClientRect();const cx=rb.left+rb.width/2,cy=rb.top+rb.height/2;const cols=['#E8640A','#16A34A','#2563EB','#B45309','#DB2777','#ffffff'];for(let i=0;i<12;i++){const p=document.createElement('div');p.className='pt';const a=Math.random()*360,d=40+Math.random()*65,sz=4+Math.random()*6;p.style.cssText='left:'+cx+'px;top:'+cy+'px;width:'+sz+'px;height:'+sz+'px;border-radius:'+(Math.random()>.5?'50%':'3px')+';background:'+cols[i%cols.length]+';--tx:'+Math.cos(a*Math.PI/180)*d+'px;--ty:'+Math.sin(a*Math.PI/180)*d+'px;animation-duration:'+(0.6+Math.random()*0.5)+'s;';ptl.appendChild(p);setTimeout(()=>p.remove(),1200);}}
function bigConfetti(){const ptl=document.getElementById('ptl');const cols=['#E8640A','#16A34A','#2563EB','#D97706','#DB2777','#7C3AED','#ffffff'];for(let i=0;i<45;i++){const p=document.createElement('div');p.className='pt';const px=(Math.random()-.5)*300,py=100+Math.random()*160,sz=5+Math.random()*9;p.style.cssText='left:'+(Math.random()*window.innerWidth)+'px;top:'+(window.innerHeight*.15+Math.random()*window.innerHeight*.35)+'px;width:'+sz+'px;height:'+sz+'px;border-radius:'+(Math.random()>.5?'50%':'3px')+';background:'+cols[i%cols.length]+';--tx:'+px+'px;--ty:'+(-py)+'px;animation-duration:'+(0.9+Math.random()*0.7)+'s;animation-delay:'+(Math.random()*0.4)+'s;';ptl.appendChild(p);setTimeout(()=>p.remove(),2000);}}

/* ══════════════════════════════════════════════════════
   PERSON NAMES & ROLE LABELS
   Each role slot can be assigned a real person's name.
   roleMembers[dept][role] = { name: 'Priya S.', label: 'AP Executive' }
   roleMembersList[dept][role] = [array of people in that role]
══════════════════════════════════════════════════════ */
let roleMembers = {}; // dept -> role -> { name, label }
let roleMembersList = {}; // dept -> role -> [{name, label}]

function getRoleName(dept, role) {
  return roleMembers[dept]?.[role]?.name || null;
}
function getRoleLabel(dept, role) {
  return roleMembers[dept]?.[role]?.label || role;
}
function setRoleMember(dept, role, name, label) {
  if (!roleMembers[dept]) roleMembers[dept] = {};
  roleMembers[dept][role] = { name: name || null, label: label || role };
  // update any displayed role names
  buildSB(); renderMain();
  toast('Updated: ' + (label||role) + (name ? ' → ' + name : ''));
}
function addRolePerson(dept, role, name) {
  if (!roleMembersList[dept]) roleMembersList[dept] = {};
  if (!roleMembersList[dept][role]) roleMembersList[dept][role] = [];
  roleMembersList[dept][role].push({ name });
}

function showRenameModal(dept, role) {
  const current = roleMembers[dept]?.[role] || {};
  const members = roleMembersList[dept]?.[role] || [];
  const memberRows = members.map((m, i) =>
    `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--t4)">
      <div style="width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center">${m.name.split(' ').map(w=>w[0]).join('').slice(0,2)}</div>
      <span style="font-size:12px;color:var(--t);flex:1">${m.name}</span>
      <button onclick="roleMembersList['${dept}']['${role}'].splice(${i},1);showRenameModal('${dept}','${role}')" style="border:none;background:none;cursor:pointer;color:var(--t3);font-size:13px">×</button>
    </div>`
  ).join('');

  const html = `
    <div class="m-ttl">Rename & assign people</div>
    <div class="m-sub" style="font-family:var(--mono);font-size:11px;color:var(--a);margin-bottom:16px">${dept} → ${role}</div>
    
    <div style="background:var(--s1);border-radius:8px;padding:12px 14px;margin-bottom:16px;">
      <label class="flbl">Role display label</label>
      <input class="finput" id="rl-label" placeholder="${role}" value="${current.label || role}">
      <div style="font-size:11px;color:var(--t3);margin-top:-6px;margin-bottom:10px">Rename the role title as it appears across the app</div>
      <label class="flbl">Assigned person</label>
      <input class="finput" id="rl-name" placeholder="e.g. Priya Sharma" value="${current.name || ''}">
      <div style="font-size:11px;color:var(--t3);margin-top:-6px">Name shown on the role card, streak, and certificates</div>
    </div>

    <div style="margin-bottom:14px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <label class="flbl" style="margin:0">Team members in this role</label>
        <button class="btn btn-g btn-sm" onclick="addPersonInline('${dept}','${role}')">+ Add person</button>
      </div>
      <div id="members-list" style="max-height:140px;overflow-y:auto">
        ${memberRows || '<div style="font-size:12px;color:var(--t3);padding:6px 0">No people added yet</div>'}
      </div>
    </div>

    <div class="m-foot">
      <button class="btn btn-g" onclick="closeModal()">Cancel</button>
      <button class="btn btn-p" onclick="saveRenameModal('${dept}','${role}')">Save changes</button>
    </div>`;
  openModal(html);
}

function addPersonInline(dept, role) {
  const name = prompt('Enter person name:');
  if (!name || !name.trim()) return;
  addRolePerson(dept, role, name.trim());
  showRenameModal(dept, role);
}

function saveRenameModal(dept, role) {
  const label = document.getElementById('rl-label')?.value?.trim();
  const name = document.getElementById('rl-name')?.value?.trim();
  setRoleMember(dept, role, name || null, label || role);
  closeModal();
}

/* Inject rename button into role display name wherever it appears */
function roleDisplayHTML(dept, role, size) {
  const label = getRoleLabel(dept, role);
  const name = getRoleName(dept, role);
  const sz = size || 15;
  return `<span style="font-size:${sz}px;font-weight:600;color:var(--t)">${label}</span>
    ${name ? `<span style="font-size:11px;color:var(--a);font-weight:600;margin-left:5px">· ${name}</span>` : ''}
    <button onclick="event.stopPropagation();showRenameModal('${dept}','${role.replace(/'/g,"\\'")}')" 
      style="border:1px solid var(--t4);border-radius:4px;background:transparent;cursor:pointer;padding:2px 6px;font-size:10px;color:var(--t3);margin-left:6px;transition:all .15s"
      onmouseover="this.style.borderColor='var(--a)';this.style.color='var(--a)'"
      onmouseout="this.style.borderColor='var(--t4)';this.style.color='var(--t3)'"
      title="Rename role / assign person">✎</button>`;
}

function selectTemplate(key) {
  selectedTemplate = key;
  document.querySelectorAll('.tmpl-card').forEach(c => {
    c.classList.remove('sel');
    c.style.borderColor = 'var(--t4)';
    c.style.background = 'var(--s0)';
  });
  const card = document.getElementById('tc-'+key);
  if (card) {
    card.classList.add('sel');
    card.style.borderColor = 'var(--a)';
    card.style.background = 'var(--a3)';
  }
  const tmpl = INDUSTRY_TEMPLATES[key];
  document.getElementById('tmpl-sel-label').textContent = tmpl.name + ' selected';
  document.getElementById('apply-tmpl-btn').style.display = 'block';
}

function applySelectedTemplate() {
  if (!selectedTemplate) return;
  applyTemplate(selectedTemplate);
}

function applyTemplate(key) {
  if (key && INDUSTRY_TEMPLATES[key]) {
    const tmpl = INDUSTRY_TEMPLATES[key];
    // Replace DB with template departments
    Object.keys(DB).forEach(k => delete DB[k]);
    Object.assign(DB, tmpl.departments);
    // Also keep Finance if not already in template (for payroll etc)
    toast('Template applied: ' + tmpl.name + ' 🎉');
  } else {
    toast('Using general template');
  }
  closeModal();
  const box = document.getElementById('modal-box');
  if (box) box.style.maxWidth = '';
  // Reset state and rebuild
  Object.keys(oD).forEach(k => delete oD[k]);
  const firstDept = Object.keys(DB)[0];
  if (firstDept) {
    oD[firstDept] = true;
    cDept = firstDept;
    cRole = Object.keys(DB[firstDept].roles)[0];
  }
  buildSB();
  renderMain();
}

function buildEnhancedRoleBtn(dn, rn, active) {
  const lg = S[dk()]?.[dn]?.[rn];
  const dn2 = lg?.daily?.filter(Boolean).length || 0;
  const tot = DB[dn].roles[rn].daily.length;
  const pct = tot ? Math.round(dn2/tot*100) : 0;
  const label = getRoleLabel(dn, rn);
  const person = getRoleName(dn, rn);
  const rb = document.createElement('div');
  rb.style.cssText = 'display:flex;align-items:center;padding:7px 14px 7px 24px;cursor:pointer;transition:background .12s;background:'+(active?'var(--a3)':'transparent')+';position:relative;';
  if (active) rb.style.borderRight = '2.5px solid var(--a)';
  rb.onmouseover = () => { if (!active) rb.style.background = 'var(--s1)'; };
  rb.onmouseout = () => { if (!active) rb.style.background = 'transparent'; };

  rb.innerHTML = `
    <div style="flex:1;min-width:0;cursor:pointer" onclick="cDept='${dn}';cRole='${rn.replace(/'/g,"\\'")}';oD['${dn}']=true;buildSB();renderMain()">
      <div style="font-size:11.5px;font-weight:${active?600:500};color:${active?'var(--a)':'var(--t2)'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${label}</div>
      ${person ? `<div style="font-size:10px;color:var(--a);margin-top:1px;font-weight:600">${person}</div>` : ''}
    </div>
    <span style="font-size:10px;padding:1px 5px;border-radius:999px;background:${active?'var(--a3)':'var(--s2)'};color:${active?'var(--a)':'var(--t3)'};font-family:var(--mono);margin-left:4px;flex-shrink:0">${pct}%</span>
    <button onclick="event.stopPropagation();showRenameModal('${dn}','${rn.replace(/'/g,"\\'")}' )" 
      style="border:1px solid var(--t4);border-radius:4px;background:transparent;cursor:pointer;padding:1px 5px;font-size:9px;color:var(--t3);margin-left:4px;opacity:0;transition:opacity .15s;flex-shrink:0"
      class="rn-btn">✎</button>`;
  rb.addEventListener('mouseenter', () => {
    const btn = rb.querySelector('.rn-btn');
    if (btn) btn.style.opacity = '1';
  });
  rb.addEventListener('mouseleave', () => {
    const btn = rb.querySelector('.rn-btn');
    if (btn) btn.style.opacity = '0';
  });
  return rb;
}

function goOpsTab(id, el) {
  document.querySelectorAll('.ops-sec').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.ops-tab').forEach(t => t.classList.remove('on'));
  const target = document.getElementById('sec-' + id);
  if(target) target.classList.add('active');
  if(el) el.classList.add('on');
}

function togCmt(id) {
  const body = document.getElementById('cb-' + id);
  const arr = document.getElementById('arr-' + id);
  if (!body || !arr) return;
  const isOpen = body.classList.toggle('open');
  arr.classList.toggle('open', isOpen);
  if (isOpen) body.querySelector('.cmt-ta')?.focus();
}

function saveCmt(id) {
  const wh = document.getElementById('wh-' + id)?.value?.trim() || '';
  const ap = document.getElementById('ap-' + id)?.value?.trim() || '';
  if (!window._OPS_SAVED) window._OPS_SAVED = {};
  window._OPS_SAVED[id] = { wh, ap, ts: new Date().toLocaleString('en-IN') };
  const pv = document.getElementById('pv-' + id);
  if (pv && wh) pv.textContent = wh.slice(0, 55) + (wh.length > 55 ? '\u2026' : '');
  refreshOpsCommentaryLog();
  toast('Commentary saved \u2713');
}

function toggleBlock(btn, bodyId) {
  const body = document.getElementById(bodyId);
  if (!body) return;
  const collapsed = body.style.display === 'none';
  body.style.display = collapsed ? '' : 'none';
  btn.textContent = collapsed ? '\u25c3' : '\u25be';
}
function collapseAll(cid) {
  const c = document.getElementById(cid);
  if (!c) return;
  c.querySelectorAll('[id$="-body"]').forEach(el => el.style.display = 'none');

  const c = document.getElementById(cid);

  c.querySelectorAll('[id$="-body"]').forEach(el => el.style.display = '');

}

function loadEmbed(sec) {
  const url = document.getElementById('url-' + sec)?.value?.trim();
  if (!url) return toast('Paste a dashboard URL first');
  const area = document.getElementById('embed-' + sec);
  const content = document.getElementById('embed-content-' + sec);
  const lbl = document.getElementById('embed-lbl-' + sec);
  if (!area || !content) return;
  area.classList.add('open');
  const name = url.includes('metabase') ? 'Metabase' : url.includes('zoho') ? 'Zoho Analytics' : url.includes('quicksight') ? 'QuickSight' : url.includes('tableau') ? 'Tableau' : url.includes('looker') ? 'Looker' : 'Dashboard';
  if (lbl) lbl.textContent = name + ' \u2014 ' + url.slice(0, 50) + (url.length > 50 ? '\u2026' : '');
  content.innerHTML = '<iframe class="embed-frame-dash" src="' + url + '" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms"></iframe>';
  toast(name + ' loading\u2026');
}
function hideEmbed(sec) {
  const area = document.getElementById('embed-' + sec);
  if (area) area.classList.remove('open');
  const content = document.getElementById('embed-content-' + sec);
